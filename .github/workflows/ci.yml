name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/dinkpromotion?schema=public
      SESSION_SECRET: ci-only-session-secret-that-is-long-enough-123
      APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: node --check bot/index.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
