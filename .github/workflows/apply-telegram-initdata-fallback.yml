name: Apply Telegram init data fallback

on:
  push:
    branches:
      - fix/telegram-initdata-fallback
    paths:
      - .github/workflows/apply-telegram-initdata-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-initdata-fallback
          fetch-depth: 0
      - name: Patch Mini App auth source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/MiniAppV3.tsx')
          s = p.read_text()
          old_import = 'import { PlatformIcon, platformClass } from "./PlatformIcon";\n'
          new_import = old_import + 'import { getTelegramInitData } from "../lib/telegram-init-data";\n'
          if 'getTelegramInitData' not in s:
              if old_import not in s:
                  raise SystemExit('PlatformIcon import anchor not found')
              s = s.replace(old_import, new_import, 1)
          old = '      const initData = tg?.initData;\n'
          new = '      const initData = getTelegramInitData();\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('initData auth anchor not found')
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "Dink Promotion CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-telegram-initdata-fallback.yml
          git add src/components/MiniAppV3.tsx src/lib/telegram-init-data.ts
          git commit -m "Use Telegram launch data fallback for Mini App auth"
          git push origin HEAD:fix/telegram-initdata-fallback
