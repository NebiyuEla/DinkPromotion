name: Apply Telegram menu auth patch

on:
  push:
    branches:
      - fix/telegram-menu-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-menu-auth
          fetch-depth: 0

      - name: Update bot keyboard and command menu
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot/index.js")
          text = path.read_text()

          old_keyboard = '''    keyboard: [
                [{ text: TEXT.open, web_app: { url: appUrl } }, { text: TEXT.favorites }],
                [{ text: TEXT.orders }, { text: TEXT.wallet }],
                [{ text: TEXT.topup }, { text: TEXT.offers }],
                [{ text: TEXT.support }],
              ],'''
          new_keyboard = '''    keyboard: [
                [{ text: TEXT.open, web_app: { url: appUrl } }],
                [{ text: TEXT.favorites }, { text: TEXT.orders }],
                [{ text: TEXT.wallet }, { text: TEXT.topup }],
                [{ text: TEXT.offers }],
              ],'''
          if old_keyboard not in text:
              raise SystemExit("Expected Telegram keyboard block not found")
          text = text.replace(old_keyboard, new_keyboard, 1)

          text = text.replace('''🔥 /offers — View offers\\n🛟 /support — Get support''', '''🔥 /offers — View offers''', 1)
          text = text.replace('''    { command: "offers", description: "View offers" },
              { command: "support", description: "Get support" },
              { command: "help", description: "Help" },''', '''    { command: "offers", description: "View offers" },
              { command: "help", description: "Help" },''', 1)
          text = text.replace('''description: "Dink Promotion — services, favorites, orders, wallet, top ups, offers and support."''', '''description: "Dink Promotion — services, favorites, orders, wallet, top ups and offers."''', 1)

          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit patch
        run: |
          git rm .github/workflows/apply-telegram-menu-auth.yml
          git config user.name "Dink Promotion CI"
          git config user.email "actions@users.noreply.github.com"
          git add bot/index.js
          git commit -m "Fix Telegram menu launch and layout"
          git push origin HEAD:fix/telegram-menu-auth
